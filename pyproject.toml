[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbaxport"
version = "1.3.0"
description = "Convert Orbax / Tunix (JAX) checkpoints to SafeTensors, PyTorch, NumPy, MsgPack, and HF folders"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "orbaxport contributors" }
]
keywords = [
  "jax",
  "orbax",
  "tunix",
  "safetensors",
  "checkpoint",
  "huggingface",
  "tpu",
  "flax",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "safetensors>=0.4.0",
  "jax>=0.4.0",
  "orbax-checkpoint>=0.5.0",
]

[project.optional-dependencies]
torch = ["torch"]
msgpack = ["msgpack>=1.0"]
yaml = ["pyyaml>=6.0"]
all = ["torch", "msgpack>=1.0", "pyyaml>=6.0", "flax>=0.8"]
dev = ["pytest>=7.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/orbaxport"
Repository = "https://github.com/YOUR_USERNAME/orbaxport"
Issues = "https://github.com/YOUR_USERNAME/orbaxport/issues"

[project.scripts]
orbaxport = "orbaxport.convert:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbaxport = ["py.typed"]
